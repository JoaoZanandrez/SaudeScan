<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Analisar</title>
</head>
<body>
    <header>
        <a href="../index.html" class="btn-voltar">Voltar</a>
        <h1>Analisar Lesão</h1>
        <p>Envie uma imagem para uma análise informativo</p>
    </header>
    <main>
        <section>
            <div>
                <p>Adiciona uma foto da lesão</p>
                <div>
                    <p>Imagem da lesão</p>
                    <img id="preview" src="" alt="Pré-visualização da lesão">
                </div>

                <input type="file" id="imagem" accept="image/*">

                <div class="boteos-imagem">
                    <a href="#"  class="btn-imagem" class="tirar-foto">Tirar foto</a>
                    <a href="#"  class="btn-imagem" class="escolher-imagem">Escolher imagem</a>
                </div>
            </div>
        </section>

        <section>
            <h2>Dicas para uma boa imagem</h2>
            <p>Utilize boa iluminação.</p>
            <p>Deixe a imagem nítida.</p>
            <p>Enquadre a lesão completamente.</p>
        </section>

        <section>
            <a href="#" class="btn-continuar">Continuar</a>
        </section>
    </main>
    <nav>
        <ul>
            <a href="../index.html">Início</a>
            <a href="cuidados.html">Cuidados</a>
            <a href="alertas.html">Alertas</a>
            <a href="sobre.html">Sobre</a>
        </ul>
    </nav>

    <script src="../js/analisar.js"></script>
</body>
</html>
